spring.application.name=Cosmetic Store Chain Management

# SQL Server Configuration (SQLEXPRESS local)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=lunea;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=lunea
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# UTF-8 & Character Encoding (Prevent Vietnamese Diacritic Distortion)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

spring.messages.encoding=UTF-8

# App Security & JWT Config
app.jwt.secret=lunea_super_secret_jwt_key_must_be_at_least_32_bytes_long_for_hs256
app.jwt.access-ttl=7200
app.security.cookie-secure=false