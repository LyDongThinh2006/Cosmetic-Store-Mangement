<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Admin Sidebar Fragment -->
<aside th:fragment="sidebar(activeMenu)" class="admin-sidebar" id="adminSidebar">
    <!-- Brand -->
    <a href="/admin" class="admin-brand">
        <div class="admin-brand-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="#0b0e14" stroke="#0b0e14" stroke-width="0.8" />
            </svg>
        </div>
        <div class="admin-brand-info">
            <h1>LUNEA</h1>
            <span>Back-office Portal</span>
        </div>
    </a>

    <!-- Staff Profile Card -->
    <div class="admin-staff-card">
        <div class="admin-staff-avatar">
            <i class="bi bi-person-fill"></i>
        </div>
        <div class="admin-staff-meta">
            <div class="admin-staff-name"
                th:text="${currentUser != null ? currentUser.displayName : 'Nhân Viên Quản Trị'}">Nguyễn Quản Trị</div>
            <div class="admin-staff-role"
                th:text="${staffRoleTitle != null ? staffRoleTitle : (currentUser != null and currentUser.isAdmin() ? 'Quản Trị Viên (Admin)' : (currentUser != null and currentUser.hasAnyAuthority('ROLE_WAREHOUSE_STAFF', 'WAREHOUSE_STAFF') ? 'Quản Lý Kho / Thủ Kho' : (currentUser != null and currentUser.hasAnyAuthority('ROLE_ORDER_STAFF', 'ORDER_STAFF') ? 'Nhân Viên Đơn Hàng' : 'Nhân viên hệ thống')))}">Quản Trị Viên (Admin)</div>
            <div class="admin-staff-branch">
                <i class="bi bi-geo-alt" style="color: var(--color-gold-primary); font-size: 0.75rem;"></i>
                <span th:text="${primaryStoreName != null ? primaryStoreName : (isAllStoresAdmin == true ? 'Toàn hệ thống (Admin)' : 'Chưa gán chi nhánh')}">Toàn hệ thống LUNEA</span>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-heading">Nghiệp vụ quản trị</div>

        <!-- Dashboard (Chỉ Admin) -->
        <a sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ADMIN')" href="/admin" class="admin-nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-speedometer2"></i>
            <span>Tổng Quan</span>
        </a>

        <!-- Orders (Admin hoặc ORDER_STAFF) -->
        <a sec:authorize="hasAnyAuthority('ORDER_VIEW', 'ORDER_PROCESS', 'ROLE_ORDER_STAFF', 'ROLE_ADMIN', 'ADMIN')" href="/admin/orders" class="admin-nav-link" th:classappend="${activeMenu == 'orders' ? 'active' : ''}">
            <i class="bi bi-box-seam"></i>
            <span>Xử Lý Đơn Hàng</span>
        </a>

        <!-- Inventory (Admin hoặc WAREHOUSE_STAFF hoặc INVENTORY_VIEW của ORDER_STAFF) -->
        <a sec:authorize="hasAnyAuthority('INVENTORY_VIEW', 'INVENTORY_ADJUST', 'ROLE_WAREHOUSE_STAFF', 'ROLE_ADMIN', 'ADMIN')" href="/admin/inventory" class="admin-nav-link" th:classappend="${activeMenu == 'inventory' ? 'active' : ''}">
            <i class="bi bi-boxes"></i>
            <span sec:authorize="hasAnyAuthority('ROLE_WAREHOUSE_STAFF', 'INVENTORY_ADJUST', 'ROLE_ADMIN', 'ADMIN')">Quản Lý Tồn Kho</span>
            <span sec:authorize="!hasAnyAuthority('ROLE_WAREHOUSE_STAFF', 'INVENTORY_ADJUST', 'ROLE_ADMIN', 'ADMIN') and hasAuthority('INVENTORY_VIEW')">Tra Cứu Tồn Kho</span>
        </a>

        <!-- Products (Chỉ Admin hoặc CATALOG_MANAGE) -->
        <a sec:authorize="hasAnyAuthority('CATALOG_MANAGE', 'ROLE_PRODUCT_MANAGER', 'ROLE_ADMIN', 'ADMIN')" href="/admin/products" class="admin-nav-link" th:classappend="${activeMenu == 'products' ? 'active' : ''}">
            <i class="bi bi-tags"></i>
            <span>Sản Phẩm & SKU</span>
        </a>

        <!-- Employees & Roles (Chỉ Admin hoặc EMPLOYEE_MANAGE) -->
        <a sec:authorize="hasAnyAuthority('EMPLOYEE_MANAGE', 'ROLE_ADMIN', 'ADMIN')" href="/admin/employees" class="admin-nav-link" th:classappend="${activeMenu == 'employees' ? 'active' : ''}">
            <i class="bi bi-person-badge"></i>
            <span>Nhân Sự & Phân Quyền</span>
        </a>

        <!-- Vouchers & Khuyến mãi (Admin hoặc VOUCHER_MANAGE) -->
        <a sec:authorize="hasAnyAuthority('VOUCHER_MANAGE', 'ROLE_ADMIN', 'ADMIN')" href="/admin/vouchers" class="admin-nav-link" th:classappend="${activeMenu == 'vouchers' ? 'active' : ''}">
            <i class="bi bi-ticket-perforated"></i>
            <span>Mã Ưu Đãi & Khuyến Mãi</span>
        </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="admin-sidebar-footer">
        <a href="/" target="_blank" rel="noopener noreferrer" class="admin-nav-link"
            style="color: var(--color-gold-light);">
            <i class="bi bi-shop"></i>
            <span>Xem Web Khách Hàng</span>
        </a>
        <a th:href="@{/logout}" href="/logout" onclick="LUNEA.logout(event)" class="admin-nav-link"
            style="width: 100%; border: none; background: transparent; cursor: pointer; text-align: left; text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <i class="bi bi-box-arrow-right"></i>
            <span>Đăng Xuất</span>
        </a>
    </div>
</aside>

</html>
