<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Admin Back-office Head Fragment -->
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'LUNEA Back-office Portal'}">LUNEA Back-office Portal</title>

    <!-- Google Fonts: Be Vietnam Pro (Hỗ trợ 100% tiếng Việt bản địa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- LUNEA Design Tokens & Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}" href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
    <script th:src="@{/js/api.js}" src="/js/api.js" defer></script>
</head>
</html>
