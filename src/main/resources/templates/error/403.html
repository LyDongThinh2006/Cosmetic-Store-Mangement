<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('403 - Quyền Truy Cập Bị Từ Chối | LUNEA')}"></head>
<body data-page="error-403" style="display: flex; flex-direction: column; min-height: 100vh;">
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="site-main" id="main-content" style="display: flex; align-items: center; justify-content: center; flex: 1;">
        <div class="lunea-container" style="max-width: 520px;">
            <div class="card-shell">
                <div class="card-core" style="text-align: center; padding: 48px 32px;">
                    <div style="font-size: 3.5rem; color: var(--color-danger); margin-bottom: 16px;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <div class="eyebrow-tag" style="margin-bottom: 12px; color: var(--color-danger); border-color: var(--color-danger-border);">403 Forbidden</div>
                    <h1 style="font-size: 1.8rem; margin-bottom: 12px;">Quyền Truy Cập Bị Từ Chối</h1>
                    <p style="color: var(--color-text-secondary); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px;">
                        Tài khoản của bạn không có đủ thẩm quyền để thực hiện hoặc xem nghiệp vụ này. Vui lòng bấm quay lại trang làm việc trước đó hoặc liên hệ Quản trị viên hệ thống (Admin).
                    </p>
                    <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
                        <button type="button" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '/admin'; }" class="btn-lunea-gold" style="border: none; cursor: pointer; text-decoration: none;">
                            <i class="bi bi-arrow-left"></i>
                            <span>Quay Lại</span>
                        </button>
                        <a th:href="@{/admin}" href="/admin" class="btn-lunea-outline">
                            <i class="bi bi-speedometer2"></i>
                            <span>Trang Quản Trị</span>
                        </a>
                        <a th:href="@{/}" href="/" class="btn-lunea-outline">
                            <i class="bi bi-house"></i>
                            <span>Trang Chủ</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
