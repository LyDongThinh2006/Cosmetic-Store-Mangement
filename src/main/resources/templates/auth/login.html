<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body data-page="auth-login">
    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="site-main" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px); padding-top: 40px;">
        <div class="auth-split-wrapper reveal-on-scroll">
            <!-- Left Side: Brand & Realistic Moon Visual (Page 6 PDF) -->
            <div class="auth-story-col">
                <span class="eyebrow-tag" style="margin-bottom: 20px;">Tài khoản LUNEA</span>
                <h1 style="font-family: var(--font-serif); font-size: clamp(2.4rem, 4.5vw, 3.4rem); font-weight: 500; line-height: 1.2; margin-bottom: 16px;">
                    Chào mừng<br>bạn trở lại.
                </h1>
                <p style="font-size: 1rem; color: var(--color-text-secondary); max-width: 380px; line-height: 1.7; font-weight: 300;">
                    Theo dõi đơn hàng và quản lý thông tin mua sắm ở cùng một nơi.
                </p>
                <div class="auth-moon-visual">
                    <img th:src="@{/images/moon-crescent.jpg}" src="/images/moon-crescent.jpg" 
                         alt="LUNEA Moonlight" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>

            <!-- Right Side: Dark Luxury Login Form (Page 6 PDF) -->
            <div class="auth-form-card">
                <h2 class="auth-title">Đăng nhập</h2>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <input type="hidden" id="redirectUrl" th:value="${redirect}">

                    <div class="form-group">
                        <label class="form-label" for="loginIdentifier">Email hoặc số điện thoại *</label>
                        <input type="text" id="loginIdentifier" class="form-control-lunea" required 
                               placeholder="Nhập email hoặc số điện thoại" autocomplete="username">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label" for="loginPassword">Mật khẩu *</label>
                        <div style="position: relative;">
                            <input type="password" id="loginPassword" class="form-control-lunea" required 
                                   placeholder="Nhập mật khẩu" autocomplete="current-password" style="padding-right: 44px;">
                            <button type="button" onclick="togglePasswordVisibility()" 
                                    style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-text-muted); cursor: pointer;">
                                <i id="eyeIcon" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--color-text-secondary);">
                            <input type="checkbox" style="accent-color: var(--color-gold-primary);">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                        <a href="javascript:void(0)" onclick="LUNEA.showToast('Vui lòng dùng tài khoản demo hoặc đăng ký tài khoản mới!', 'info')" 
                           style="color: var(--color-text-secondary); text-decoration: none;">
                            Quên mật khẩu?
                        </a>
                    </div>

                    <button type="submit" id="btnLoginSubmit" class="btn-lunea-gold" style="width: 100%; justify-content: center; padding: 13px; font-size: 0.95rem;">
                        <span>Đăng nhập</span>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--color-text-secondary);">
                    Chưa có tài khoản? 
                    <a th:href="@{/register}" href="/register" style="color: var(--color-gold-light); font-weight: 600; margin-left: 6px;">Đăng ký</a>
                </div>

                <!-- Quick Demo Fill Pills -->
                <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--color-border-subtle);">
                    <div style="font-size: 0.72rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; text-align: center;">
                        <i class="bi bi-key" style="margin-right: 4px;"></i> Điền nhanh tài khoản demo (Mật khẩu: 123456)
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button type="button" onclick="fillDemo('khach01@lunea.test', '123456')" class="variant-pill" style="text-align: left; padding: 6px 12px; font-size: 0.78rem;">
                            <i class="bi bi-person" style="margin-right: 6px; color: var(--color-gold-light);"></i> <strong>Khách hàng:</strong> khach01@lunea.test
                        </button>
                        <button type="button" onclick="fillDemo('order_hcm', '123456')" class="variant-pill" style="text-align: left; padding: 6px 12px; font-size: 0.78rem;">
                            <i class="bi bi-building" style="margin-right: 6px; color: var(--color-gold-light);"></i> <strong>Nhân viên HCM:</strong> order_hcm
                        </button>
                        <button type="button" onclick="fillDemo('admin', '123456')" class="variant-pill" style="text-align: left; padding: 6px 12px; font-size: 0.78rem;">
                            <i class="bi bi-shield-lock" style="margin-right: 6px; color: var(--color-gold-light);"></i> <strong>Quản trị viên:</strong> admin
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Client-side Login Script -->
    <script th:inline="javascript">
        function togglePasswordVisibility() {
            const pwd = document.getElementById('loginPassword');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                eye.className = 'bi bi-eye';
            }
        }

        function fillDemo(username, password) {
            document.getElementById('loginIdentifier').value = username;
            document.getElementById('loginPassword').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const redirectUrl = document.getElementById('redirectUrl').value;
            const btn = document.getElementById('btnLoginSubmit');

            if (!identifier || !password) {
                LUNEA.showToast('Vui lòng nhập đầy đủ thông tin đăng nhập!', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                const res = await LUNEA.apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password
                    })
                });

                LUNEA.showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');

                setTimeout(() => {
                    if (res && res.isEmployee) {
                        window.location.href = '/admin';
                    } else if (redirectUrl && redirectUrl.startsWith('/') && !redirectUrl.startsWith('/login')) {
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = '/';
                    }
                }, 600);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Đăng nhập</span>';
            }
        }
    </script>

    <!-- Toast Fragment -->
    <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
