services:
  postgres:
    image: postgres:16
    container_name: lunea
    environment:
      POSTGRES_DB: lunea
      POSTGRES_USER: lunea
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"
    volumes:
      - lunea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunea -d lunea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lunea_pgdata:
